name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    if: github.actor != 'github-actions[bot]' && !contains(github.event.head_commit.message, 'chore(release):')
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute next version
        id: version
        run: |
          START_VERSION="0.1.0"
          FILE_VERSION="$(cat VERSION 2>/dev/null || echo "$START_VERSION")"
          LATEST_TAG="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          validate_semver() {
            case "$1" in
              ''|*[!0-9.]*|*.*.*.*|*..*|.*|*.) return 1 ;;
            esac
            IFS='.' read -r A B C <<< "$1"
            [ -n "$A" ] && [ -n "$B" ] && [ -n "$C" ]
          }

          if ! validate_semver "$FILE_VERSION"; then
            echo "Invalid VERSION format: $FILE_VERSION"
            exit 1
          fi

          if [ -z "$LATEST_TAG" ]; then
            NEXT_VERSION="$FILE_VERSION"
          else
            if ! validate_semver "$LATEST_TAG"; then
              echo "Invalid tag format: $LATEST_TAG"
              exit 1
            fi

            IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST_TAG"
            NEXT_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          echo "next=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Update VERSION and create tag
        env:
          NEXT_VERSION: ${{ steps.version.outputs.next }}
        run: |
          if git rev-parse "${NEXT_VERSION}" >/dev/null 2>&1; then
            echo "Tag ${NEXT_VERSION} already exists. Skipping."
            exit 0
          fi

          echo "$NEXT_VERSION" > VERSION
          git add VERSION
          git commit -m "chore(release): ${NEXT_VERSION} [skip ci]"
          git tag "${NEXT_VERSION}"
          git push origin main
          git push origin "${NEXT_VERSION}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next }}
          name: ${{ steps.version.outputs.next }}
          generate_release_notes: true
